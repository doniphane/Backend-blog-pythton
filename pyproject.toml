[project]
name = "backend-blog"
version = "0.1.0"
description = "FastAPI blog backend with JWT auth and PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "alembic>=1.13",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
